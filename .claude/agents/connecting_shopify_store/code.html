<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        .spin-slow {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pulse-soft {
            animation: pulseSoft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulseSoft {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface min-h-screen flex flex-col font-body-lg text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed for transactional connection flow, but showing brand anchor minimal header) -->
<header class="flex justify-between items-center px-gutter h-16 w-full fixed top-0 z-50 bg-surface border-b border-outline-variant">
<div class="font-headline-md text-headline-md font-bold text-primary">OmniSell</div>
<div>
<span class="material-symbols-outlined text-outline" data-icon="close">close</span>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-gutter md:p-xl mt-16 w-full max-w-2xl mx-auto text-center">
<div class="mb-xl relative flex items-center justify-center">
<!-- Outer spinning ring -->
<svg class="w-32 h-32 text-outline-variant spin-slow" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<circle cx="50" cy="50" r="48" stroke="currentColor" stroke-dasharray="80 20" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Inner primary circle -->
<svg class="w-24 h-24 text-primary absolute inset-0 m-auto pulse-soft" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<circle cx="50" cy="50" r="40" stroke="currentColor" stroke-dasharray="160 40" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="absolute inset-0 m-auto flex items-center justify-center bg-surface-container-lowest rounded-full w-16 h-16 shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="storefront">storefront</span>
</div>
</div>
<h1 class="font-display-lg text-display-lg md:font-display-lg md:text-display-lg mb-sm text-on-surface">Connecting Shopify...</h1>
<p class="font-body-lg text-body-lg text-secondary mb-xl max-w-md mx-auto">This usually takes less than a minute. Please don't close this window.</p>
<div class="w-full max-w-sm mx-auto space-y-md bg-surface-container-lowest border border-outline-variant p-md rounded-lg shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-on-surface">Authorizing with Shopify...</span>
</div>
<div class="flex items-center gap-md">
<div class="relative w-6 h-6 flex items-center justify-center">
<svg class="w-5 h-5 text-primary spin-slow" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-dasharray="40 20" stroke-linecap="round" stroke-width="3"></circle>
</svg>
</div>
<span class="font-body-md text-body-md text-on-surface font-semibold">Fetching product catalog...</span>
</div>
<div class="flex items-center gap-md opacity-50">
<span class="material-symbols-outlined text-outline" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-body-md text-body-md text-outline">Syncing recent orders...</span>
</div>
</div>
</main>
<!-- Bottom Nav Suppressed for Transactional Flow -->
</body></html>
